<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Emocional Estudiantil</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>¿Cómo te sientes hoy?</h1>
            <p>Selecciona tu estado de ánimo y evalúa tu energía del 1 al 10</p>
            <a href="orientador.html" class="link-orientador">🔒 Acceso Orientador</a>
        </header>

        <main class="card">
            <form id="emotionForm">
                <div class="form-group">
                    <label for="studentName">Matrícula o Nombre:</label>
                    <input type="text" id="studentName" required placeholder="Ej. Juan Pérez">
                </div>

                <label>¿Cómo te sientes en este momento?</label>
                <div class="emotions-grid">
                    <button type="button" class="emotion-btn" data-emotion="Feliz">
                        <span class="emoji">😄</span>
                        <span class="label">Feliz</span>
                    </button>
                    <button type="button" class="emotion-btn" data-emotion="Tranquilo">
                        <span class="emoji">😌</span>
                        <span class="label">Tranquilo</span>
                    </button>
                    <button type="button" class="emotion-btn" data-emotion="Neutral">
                        <span class="emoji">😐</span>
                        <span class="label">Neutral</span>
                    </button>
                    <button type="button" class="emotion-btn" data-emotion="Triste">
                        <span class="emoji">😢</span>
                        <span class="label">Triste</span>
                    </button>
                    <button type="button" class="emotion-btn" data-emotion="Estresado">
                        <span class="emoji">🤯</span>
                        <span class="label">Estresado</span>
                    </button>
                </div>

                <input type="hidden" id="selectedEmotion">

                <div class="form-group" style="margin-top: 25px;">
                    <label for="scoreRange">Califica tu bienestar / energía general del 1 al 10: <span id="rangeValue" style="color: #4a90e2; font-weight: bold;">5</span></label>
                    <input type="range" id="scoreRange" min="1" max="10" value="5" class="slider">
                    <div class="range-labels">
                        <span>1 (Muy bajo)</span>
                        <span>10 (Excelente)</span>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary" disabled>Registrar mi estado</button>
            </form>

            <div id="successMsg" class="success-msg hidden">
                <h3>¡Registro guardado con éxito!</h3>
                <p>Gracias por compartir cómo te sientes hoy.</p>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
